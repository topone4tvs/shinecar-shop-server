# 洗车店智能设备管理系统配置
# 开发环境配置

# HTTP服务器配置
server:
  host: "0.0.0.0"
  port: 8080

# MQTT配置
mqtt:
  broker: "localhost"
  port: 1883
  username: ""
  password: ""
  client_id: "shop_server_shop_001"
  topics:
    pattern: "shinecar/shop/%s/station/%s"

# 店铺配置
shop:
  id: "001"
  name: "智能洗车店一号店"
  stations:
    - id: "001"
      name: "1号工位"
      devices:
        plate:
          enable: true
          endpoint: "/api/plate/station/001"
        ha:
          enable: true
          entity_id: "switch.cozylife_7gt0_switch"
          air_conditioner: "climate.xiaomi_m16_0c7c_air_conditioner"
          ventilation: "switch.cozylife_7gt0_switch"
          speaker: "text.xiaomi_l05b_a7be_play_text"
          player: "button.xiaomi_l05b_a7be_play_music"
          media_control: "media_player.xiaomi_l05b_a7be_play_control"
    - id: "002"
      name: "2号工位"
      devices:
        plate:
          enable: true
          endpoint: "/api/plate/station/002"
        ha:
          enable: true
          entity_id: "switch.cozylife_5IJP_switch"
          air_conditioner: "climate.xiaomi_m16_0be4_air_conditioner"
          ventilation: "switch.cozylife_5IJP_switch"
          speaker: "text.xiaomi_l05b_0572_play_text"
          player: "button.xiaomi_l05b_0572_play_music"
          media_control: "media_player.xiaomi_l05b_0572_play_control"

# 设备配置
devices:
  ha:
    base_url: "http://localhost:8123"
    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiIzN2MyMTcxMTgyNWM0NjYzODAwNDE5NmNhZWRiMTFjNyIsImlhdCI6MTc1ODMzNjUzNiwiZXhwIjoyMDczNjk2NTM2fQ.D84u0fyjK867cDlfikzXrx3HnLffplgbfl93kB6JKr4"
    timeout: 10
    headers:
      Content-Type: "application/json"

# 日志配置
log:
  level: "debug"
  format: "text"
  output: "stdout" 
