# 洗车店智能设备管理系统配置
# 开发环境配置

# HTTP服务器配置
server:
  host: "0.0.0.0"
  port: 8080

# MQTT配置
mqtt:
  broker: "localhost"
  port: 1883
  username: ""
  password: ""
  client_id: "shop_server_shop_001"
  topics:
    pattern: "shinecar/shop/%s/station/%s"

# 店铺配置
shop:
  id: "1"
  name: "智能洗车店一号店"
  stations:
    - id: "1"
      name: "1号工位"
      devices:
        plate:
          enable: true
          endpoint: "/api/plate/station/001"
        ha:
          enable: true
          entity_id: "switch.station_001"
    - id: "2"
      name: "2号工位"
      devices:
        plate:
          enable: true
          endpoint: "/api/plate/station/002"
        ha:
          enable: true
          entity_id: "switch.station_002"

# 设备配置
devices:
  ha:
    base_url: "http://homeassistant.local:8123"
    token: "your_ha_token_here"
    timeout: 10
    headers:
      Content-Type: "application/json"

# 日志配置
log:
  level: "debug"
  format: "text"
  output: "stdout" 